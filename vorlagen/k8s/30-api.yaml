apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: viertelwatt
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: viertelwatt-daten:1.0.0
          imagePullPolicy: IfNotPresent   # Image kommt per kind load, nicht aus einer Registry
          ports:
            - containerPort: 8000
          env:                     # APP_VERSION steckt schon im Image (--build-arg)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: viertelwatt-geheim
                  key: DATABASE_URL
          readinessProbe:          # Bekommt der Pod Anfragen?
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:           # Muss der Container neu gestartet werden?
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: viertelwatt
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000
