# Vorbereitete Störung. Anwenden mit: kubectl apply -f stoerungen/stoerung-e.yaml
# Aufgabe: Der Pod läuft. Trotzdem antwortet der Service stoerung-e nicht. Warum?
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stoerung-e
  namespace: viertelwatt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stoerung-e
  template:
    metadata:
      labels:
        app: stoerung-e
    spec:
      containers:
        - name: api
          image: viertelwatt-daten:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: viertelwatt-geheim
                  key: DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: stoerung-e
  namespace: viertelwatt
spec:
  selector:
    app: stoerung-e-neu
  ports:
    - port: 80
      targetPort: 8000
