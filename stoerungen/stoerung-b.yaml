# Vorbereitete Störung. Anwenden mit: kubectl apply -f stoerungen/stoerung-b.yaml
# Aufgabe: Finde heraus, was nicht stimmt, nur mit get, describe, logs und events.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stoerung-b
  namespace: viertelwatt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stoerung-b
  template:
    metadata:
      labels:
        app: stoerung-b
    spec:
      containers:
        - name: api
          image: viertelwatt-daten:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: viertelwatt-geheimnis
                  key: DATABASE_URL
