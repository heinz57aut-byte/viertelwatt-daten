# Vorbereitete Störung. Anwenden mit: kubectl apply -f stoerungen/stoerung-f.yaml
# Aufgabe: Finde heraus, was nicht stimmt, nur mit get, describe, logs und events.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stoerung-f
  namespace: viertelwatt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stoerung-f
  template:
    metadata:
      labels:
        app: stoerung-f
    spec:
      containers:
        - name: api
          image: viertelwatt-daten:1.0.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "32"
              memory: 128Gi
